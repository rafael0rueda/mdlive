name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Neovim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release, current stable and nightly.
        neovim: [v0.11.0, stable, nightly]
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Smoke test
        run: make test

      - name: Help tags
        run: make helptags

  # The same checks on macOS and Windows, with the stable release. Windows runs
  # the smoke test only for now; the browser tests stop Chrome through Unix
  # process groups.
  platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests (macOS)
            os: macos-latest
            target: test
          - name: Browser tests (macOS)
            os: macos-latest
            target: browser
          - name: Tests (Windows)
            os: windows-latest
            target: test
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: actions/setup-node@v7
        if: matrix.target == 'browser'
        with:
          node-version: 22

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The runner image comes with Google Chrome.
      - name: Browser tests
        run: make browser

  vendor:
    name: Vendored libraries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check app/vendor against scripts/vendor.json
        run: make vendor-check

      # The committed files must be exactly what the pinned npm packages contain.
      - name: Rebuild app/vendor from npm
        run: |
          make vendor
          if [ -n "$(git status --porcelain -- app/vendor scripts/vendor.json)" ]; then
            git status --short -- app/vendor scripts/vendor.json
            echo "::error::app/vendor differs from the npm packages pinned in scripts/vendor.json"
            exit 1
          fi

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Neovim runtime provides the types of the vim and vim.uv modules.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # The versions pinned in the Makefile.
      - name: Install stylua and lua-language-server
        run: |
          make tools TOOLS="$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: lua-language-server --check
        run: make typecheck

  style:
    name: Stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The versions pinned in the Makefile.
      - name: Install stylua and lua-language-server
        run: |
          make tools TOOLS="$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: stylua --check
        run: make lint
