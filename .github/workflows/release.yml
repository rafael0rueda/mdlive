name: Release

# Pushing a tag like v0.1.0 publishes a GitHub release with that version's
# section of CHANGELOG.md as its notes.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A release is always a commit that went through a pull request and CI.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          make release-notes VERSION="${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::The CHANGELOG.md section for ${GITHUB_REF_NAME#v} is empty"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "mdlive $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease
